<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cambiar rol</title>
</head>
<body>
    <main>
        <h1>Cambiar rol</h1>
        <p>Usuario: {{ target.email }}</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar rol</button>
        </form>
        <p><a href="{% url 'accounts:user_list' %}">Cancelar</a></p>
    </main>
</body>
</html>
