{% extends "base.html" %}
{% block title %}Cambiar rol{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
    <div class="page-heading"><p class="page-kicker">Administración</p><h1 class="h2">Cambiar rol</h1><p class="text-body-secondary mb-0">Usuario: {{ target.email }}</p></div>
    <section class="card app-card"><div class="card-body p-4 p-md-5"><form method="post" novalidate>{% csrf_token %}{% include "includes/form_fields.html" %}<div class="d-flex gap-2 justify-content-end"><a class="btn btn-outline-secondary" href="{% url 'accounts:user_list' %}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar rol</button></div></form></div></section>
</div></div>
{% endblock %}
