<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear usuario</title>
</head>
<body>
    <main>
        <h1>Crear usuario</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Crear usuario</button>
        </form>
        <p><a href="{% url 'accounts:user_list' %}">Cancelar</a></p>
    </main>
</body>
</html>
