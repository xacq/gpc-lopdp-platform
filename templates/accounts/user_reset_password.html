<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablecer contraseña</title>
</head>
<body>
    <main>
        <h1>Restablecer contraseña</h1>
        <p>Usuario: {{ target.email }}</p>
        <p>El usuario deberá configurar nuevamente su MFA.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Restablecer contraseña</button>
        </form>
        <p><a href="{% url 'accounts:user_list' %}">Cancelar</a></p>
    </main>
</body>
</html>
