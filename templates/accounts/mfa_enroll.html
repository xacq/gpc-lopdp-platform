<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Configurar verificación en dos pasos</title>
</head>
<body>
    <main>
        <h1>Configurar verificación en dos pasos</h1>
        <p>Agrega esta cuenta a tu aplicación de autenticación.</p>
        <p><img src="{{ qr_data_uri }}" alt="Código QR para configurar MFA"></p>
        <p><strong>Clave manual:</strong> <code>{{ secret }}</code></p>
        <details>
            <summary>URI para código QR</summary>
            <code>{{ provisioning_uri }}</code>
        </details>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Verificar y activar</button>
        </form>
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">Cancelar acceso</button>
        </form>
    </main>
</body>
</html>
