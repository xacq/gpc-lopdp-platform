{% load form_ui %}
<div class="public-field{% if field.errors %} public-field--error{% endif %}{% if class_name %} {{ class_name }}{% endif %}">
    <label class="public-field__label" for="{{ field.id_for_label }}">
        {{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true">*</span>{% endif %}
    </label>
    {{ field|bootstrap_field }}
    {% if field.help_text %}<div class="public-field__help">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="public-field__error" role="alert">{{ error }}</div>{% endfor %}
</div>
