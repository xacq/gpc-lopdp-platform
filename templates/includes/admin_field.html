<div class="admin-form-field{% if field.errors %} admin-form-field--error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<div class="admin-form-field__error">{{ error }}</div>{% endfor %}
</div>
