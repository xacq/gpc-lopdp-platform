{% extends "base.html" %}
{% block title %}Resolver expediente{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
    <div class="page-heading"><a class="small text-decoration-none" href="{% url 'cases:request_detail' request_id=case.id %}">← Volver al expediente</a><p class="page-kicker mt-3">{{ case.reference_number }}</p><h1 class="h2">Resolver expediente</h1></div>
    <section class="card app-card"><div class="card-body p-4 p-md-5"><form method="post" novalidate>{% csrf_token %}{% include "includes/form_fields.html" %}<div class="d-flex justify-content-end"><button class="btn btn-primary" type="submit">Registrar resolución</button></div></form></div></section>
</div></div>
<script>
    (function () {
        const resolutionType = document.getElementById("id_resolution_type");
        const outcomeReason = document.getElementById("id_outcome_reason");
        if (!resolutionType || !outcomeReason) return;

        const reasonTypeByResolution = {
            REJECTED: "REJECTION",
            ARCHIVED: "ARCHIVE",
            CANCELLED: "CANCELLATION",
        };
        const row = outcomeReason.closest(".mb-3");

        function updateReasons() {
            const requiredType = reasonTypeByResolution[resolutionType.value];
            let selectedIsValid = false;

            Array.from(outcomeReason.options).forEach(function (option) {
                if (!option.value) return;
                const visible = option.dataset.reasonType === requiredType;
                option.hidden = !visible;
                option.disabled = !visible;
                if (option.selected && visible) selectedIsValid = true;
            });

            if (!selectedIsValid) outcomeReason.value = "";
            outcomeReason.required = Boolean(requiredType);
            row.hidden = !requiredType;
        }

        resolutionType.addEventListener("change", updateReasons);
        updateReasons();
    }());
</script>
{% endblock %}
