name: ${COMPOSE_PROJECT_NAME:-gpc-lopdp-vinesa}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - ${TENANT_ENV_FILE:-deploy/docker.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql

  web:
    image: gpc-lopdp-platform:local
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${TENANT_ENV_FILE:-deploy/docker.env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - private_data:/app/private_storage
      - clamav_data:/var/lib/clamav

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro

volumes:
  postgres_data:
  static_data:
  media_data:
  private_data:
  clamav_data:
